name: Refresh property calendars

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh calendar data
        env:
          AIRBNB_ICS_URLS: ${{ secrets.AIRBNB_ICS_URLS }}
        run: python3 scripts/refresh_calendars.py

      - name: Commit changes if any
        run: |
          git config user.name "rentify-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/calendars; then
            git add data/calendars
            git commit -m "Refresh property availability calendars"
            git push
          else
            echo "No calendar changes to commit."
          fi
